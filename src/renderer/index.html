<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Koa Kommander</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <nav class="menu-row" aria-label="Application menu">
      <div class="menu-group">
        <button class="menu-trigger" aria-expanded="false">File</button>
        <div class="menu-dropdown" hidden><button>New</button><button>Open</button><div class="menu-rule"></div><button>Exit</button></div>
      </div>
      <div class="menu-group">
        <button class="menu-trigger" aria-expanded="false">Edit</button>
        <div class="menu-dropdown" hidden><button>Undo</button><div class="menu-rule"></div><button>Cut</button><button>Copy</button><button>Paste</button><button>Select all</button></div>
      </div>
      <div class="menu-group">
        <button class="menu-trigger" aria-expanded="false">Help</button>
        <div class="menu-dropdown" hidden><button>Help</button><button>About Koa Kommander</button></div>
      </div>
    </nav>
    <div class="tool-row" aria-label="Toolbar">
      <button class="dummy-tool" title="New folder" aria-label="New folder"><svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2H21v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/><path d="M12 11v6M9 14h6"/></svg></button>
      <span class="tool-divider"></span>
      <button class="dummy-tool" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg></button>
      <button class="dummy-tool" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7M16 12H4"/></svg></button>
      <button class="dummy-tool" title="Up one folder" aria-label="Up one folder"><svg viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
      <span class="tool-divider"></span>
      <button class="dummy-tool" title="Copy" aria-label="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
      <button class="dummy-tool" title="Move" aria-label="Move"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="dummy-tool" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel is-active" id="panel-left" data-panel="left" aria-label="Left file panel"></section>
    <div class="splitter" aria-hidden="true"><div class="splitter-handle"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
    <section class="panel" id="panel-right" data-panel="right" aria-label="Right file panel"></section>
  </main>

  <footer class="statusbar">
    <div class="status-left"><span class="status-dot"></span><span id="status-message">Ready</span></div>
    <div class="status-right"><span id="selection-summary">Nothing selected</span><span class="status-separator"></span><span>2 panels</span></div>
  </footer>

  <div class="context-menu" id="context-menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./renderer.js"></script>
</body>
</html>
