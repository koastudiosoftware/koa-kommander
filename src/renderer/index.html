<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Koa Kommander</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="tool-row" aria-label="Toolbar">
      <button class="dummy-tool" data-action="new-folder" title="New folder" aria-label="New folder"><svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2H21v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/><path d="M12 11v6M9 14h6"/></svg></button>
      <span class="tool-divider"></span>
      <button class="dummy-tool" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg></button>
      <button class="dummy-tool" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7M16 12H4"/></svg></button>
      <span class="tool-divider"></span>
      <button class="dummy-tool" data-action="copy" title="Copy (Ctrl+C)" aria-label="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
      <button class="dummy-tool" data-action="cut" title="Cut (Ctrl+X)" aria-label="Cut"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><path d="m8 7 12 12M8 17 20 5"/></svg></button>
      <button class="dummy-tool" data-action="paste" title="Paste (Ctrl+V)" aria-label="Paste"><svg viewBox="0 0 24 24"><path d="M9 4.5h6a2 2 0 0 1 2 2V8H7V6.5a2 2 0 0 1 2-2Z"/><path d="M7 6H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2M7 8h10M15 15h7M18.5 11.5v7"/></svg></button>
      <button class="dummy-tool" data-action="rename" title="Rename selected item" aria-label="Rename"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L9 19l-5 1 1-5Z"/></svg></button>
      <button class="dummy-tool" data-action="delete" title="Delete (Delete)" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <span class="tool-spacer"></span>
      <button class="dummy-tool" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M10 2.8h4l.55 2.15c.53.18 1.03.47 1.48.83l2.17-.62 2 3.46-1.62 1.55a5.8 5.8 0 0 1 0 1.68l1.62 1.55-2 3.46-2.17-.62c-.45.36-.95.65-1.48.83L14 19.2h-4l-.55-2.15c-.53-.18-1.03-.47-1.48-.83l-2.17.62-2-3.46 1.62-1.55a5.8 5.8 0 0 1 0-1.68L3.8 8.6l2-3.46 2.17.62c.45-.36.95-.65 1.48-.83z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      <button class="dummy-tool" title="About Koa Kommander" aria-label="About Koa Kommander"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel is-active" id="panel-left" data-panel="left" aria-label="Left file panel"></section>
    <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panels" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="-1"><div class="splitter-handle"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
    <section class="panel" id="panel-right" data-panel="right" aria-label="Right file panel"></section>
  </main>

  <footer class="statusbar">
    <div class="status-left"><span class="status-dot"></span><span id="status-message">Ready</span></div>
    <div class="status-right"><span id="selection-summary">Nothing selected</span><span class="status-separator"></span><span>2 panels</span></div>
  </footer>

  <div class="context-menu" id="context-menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./renderer.js"></script>
</body>
</html>
